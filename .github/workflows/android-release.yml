name: Android Release

# 发版：推送 v{version}+{build} 格式的 tag 触发，例如 v0.4.0+5
# 版本号与 build number 从 tag 解析并覆盖 pubspec，保证 versionCode 单调递增
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android platforms
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null

      - name: Parse version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          # v0.4.0+5 → version=0.4.0 build=5
          VERSION="${TAG#v}"
          BUILD="${VERSION##*+}"
          VERSION="${VERSION%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore (固定令牌)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::发版 Secrets 未配置：请在仓库 Settings → Secrets and variables → Actions 添加 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（步骤见 RELEASING.md），然后删除并重推 tag。"
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Pub get & codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      - name: Build split APKs（按 ABI 拆分，不打 universal 大包）
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ steps.ver.outputs.build }} \
            --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=GITHUB_REPO=${{ github.repository }}

      - name: Verify signing (升级不丢数据的前提：与历史版本同一签名)
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$apk" | head -3
          done

      - name: Generate update-info.json
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          RELEASE_URL="https://github.com/$REPO/releases/download/${GITHUB_REF_NAME}"
          cat > build/app/outputs/flutter-apk/update-info.json <<EOF
          {
            "version": "$VERSION",
            "buildNumber": $BUILD,
            "notes": "版本 $VERSION（build $BUILD）。升级不丢失本地数据。",
            "apkUrls": {
              "arm64-v8a": "$RELEASE_URL/aivault-arm64-v8a.apk",
              "armeabi-v7a": "$RELEASE_URL/aivault-armeabi-v7a.apk",
              "x86_64": "$RELEASE_URL/aivault-x86_64.apk"
            }
          }
          EOF

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk aivault-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk aivault-armeabi-v7a.apk
          mv app-x86_64-release.apk aivault-x86_64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AIVault ${{ steps.ver.outputs.version }}
          body: |
            ## v${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }})

            ### 安装包（按设备架构选择，覆盖安装升级不丢数据）
            | 安装包 | 适用设备 |
            |---|---|
            | `aivault-arm64-v8a.apk` | 主流 64 位手机（近年的设备） |
            | `aivault-armeabi-v7a.apk` | 老 32 位设备 |
            | `aivault-x86_64.apk` | 模拟器 / x86 设备 |

            - 同一固定签名密钥发布，可直接覆盖安装升级，本地数据（订阅 / Token / 聊天 / SSH 配置）完整保留
            - App 内「设置 → 检查更新」可自动检测并升级
          files: |
            build/app/outputs/flutter-apk/aivault-arm64-v8a.apk
            build/app/outputs/flutter-apk/aivault-armeabi-v7a.apk
            build/app/outputs/flutter-apk/aivault-x86_64.apk
            build/app/outputs/flutter-apk/update-info.json
